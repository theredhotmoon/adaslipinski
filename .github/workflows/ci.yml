name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend (PHPUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # 8.4 to match the Dockerfile + composer.lock (some deps require ~8.4)
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, mbstring, fileinfo, openssl
          coverage: none

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan passport:keys --no-interaction

      - name: Run tests
        run: php vendor/bin/phpunit

  frontend:
    name: Frontend (Vitest + type-check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Run tests
        run: npm run test

  web:
    name: Public site (Astro build + check)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          # Astro 6 requires Node >=22.12 (the frontend SPA job stays on 20).
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run check

      # The CMS API isn't reachable in CI, so the build uses bundled fallback
      # content (see src/lib/fallback.ts) — it must still produce a complete site.
      - name: Build
        run: npm run build

      # Browser-level smoke test: catches client hydration regressions that blank the
      # page (which a plain HTTP/build check cannot). Runs against `astro preview`.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E smoke test
        run: npm run test:e2e

  web-cms-e2e:
    name: Public site CMS e2e (section hiding)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: sqlite3, pdo_sqlite, mbstring, fileinfo, openssl
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Set up seeded backend + Passport
        working-directory: backend
        run: |
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate
          php artisan migrate --seed --force
          php artisan passport:keys --no-interaction
          php artisan passport:client --personal --no-interaction --name="CI"

      - name: Start backend
        working-directory: backend
        run: |
          nohup php artisan serve --host=127.0.0.1 --port=8000 > /tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/api/health >/dev/null && exit 0; sleep 1; done
          echo "backend did not start"; cat /tmp/serve.log; exit 1

      - name: Hide the "expenses" section via the settings API
        run: |
          TOKEN=$(curl -s -X POST http://127.0.0.1:8000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"email":"admin@example.com","password":"password123"}' \
            | python3 -c "import sys,json;print(json.load(sys.stdin)['token'])")
          curl -s -X PUT http://127.0.0.1:8000/api/admin/settings \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"hiddenSections":["expenses"]}' \
            | python3 -c "import sys,json;d=json.load(sys.stdin);assert d['hiddenSections']==['expenses'],d;print('hidden:',d['hiddenSections'])"

      - name: Build the site against the backend
        working-directory: web
        env:
          CMS_API_URL: http://127.0.0.1:8000/api
        run: |
          npm ci
          npm run build

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Assert the hidden section is gone (control section remains)
        working-directory: web
        env:
          HIDDEN_SECTION: expenses
          CONTROL_SECTION: budget
        run: npm run test:e2e:cms

  deploy-web:
    name: Deploy public site (trigger build hook)
    # Only after the whole suite is green, and only for pushes to the default
    # branch (a squash-merge lands here) — never on pull requests.
    needs: [backend, frontend, web, web-cms-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # Pings the host's build hook so a *code* change to web/ redeploys the static
      # site. (The Laravel DEPLOY_HOOK_URL handles *content* changes; both can point
      # at the same hook.) No-op until the WEB_DEPLOY_HOOK_URL secret is set, so this
      # is safe before a host exists.
      - name: Trigger deploy hook
        env:
          HOOK_URL: ${{ secrets.WEB_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK_URL" ]; then
            echo "WEB_DEPLOY_HOOK_URL is not set — skipping deploy (no host configured yet)."
            exit 0
          fi
          echo "Triggering public-site rebuild…"
          code=$(curl -sS -X POST -o /dev/null -w '%{http_code}' "$HOOK_URL")
          echo "Deploy hook responded with HTTP $code"
          case "$code" in
            2*) echo "Deploy triggered." ;;
            *)  echo "::error::Deploy hook failed (HTTP $code)"; exit 1 ;;
          esac
